name: LC381111 Return to LiveContainer + RP + Nested Guest

on:
  push:
    branches: [fix/return-to-container-381111, fix/prephone-auth-preservation-20261020, fix/anisette-catalog-offline-fallback-20261020]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - name: Checkout fixed SideStore 0.7 source
        uses: actions/checkout@v4
        with:
          path: sidestore
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Checkout pinned previously repaired LiveContainer 3.8.11 host
        uses: actions/checkout@v4
        with:
          repository: fanchen000/LiveContainer
          ref: 1a43f38b1608ea21c761d779181cffa28d3e96d6
          path: live
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.2'

      - name: Preflight exact fixed source and regression test
        shell: bash
        run: |
          set -euo pipefail
          git -C sidestore merge-base --is-ancestor e3b7e9941b3d7d108a907187b3d013d6c082098a HEAD
          test "$(git -C live rev-parse HEAD)" = 1a43f38b1608ea21c761d779181cffa28d3e96d6
          test "$(git -C sidestore/Dependencies/SideSign rev-parse HEAD)" = f4e8df8bd979cba11ddf7c4898e2a5d03ae00dab
          test -s sidestore/patches/SideSign/gsa_windows_akd_20261018.patch
          python3 sidestore/scripts/test_hsc434_remote_mode.py
          python3 sidestore/scripts/test_prephone_auth_preservation.py
          python3 sidestore/scripts/test_reauthenticate_without_signout.py
          python3 sidestore/scripts/test_anisette_offline_fallback.py
          git -C sidestore diff --exit-code
          git -C live diff --exit-code
          echo "PINNED_FIXED_INPUTS_VERIFIED"

      - name: Apply minimal GSA endpoint-only compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          git -C sidestore/Dependencies/SideSign apply --check "$GITHUB_WORKSPACE/sidestore/patches/SideSign/gsa_windows_akd_20261018.patch"
          git -C sidestore/Dependencies/SideSign apply "$GITHUB_WORKSPACE/sidestore/patches/SideSign/gsa_windows_akd_20261018.patch"
          git -C sidestore/Dependencies/SideSign diff --check
          grep -F 'Self.grandSlamClientInfo(anisetteData.clientInfo)' sidestore/Dependencies/SideSign/Sources/DeveloperPortal/Authentication.swift
          echo "GSA_ENDPOINT_ONLY_PATCH_APPLIED"

      - name: Run SideSign compatibility regression tests
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cd sidestore/Dependencies/SideSign
          swift test --filter 'grandSlam' > "$RUNNER_TEMP/sidesign-gsa-tests.log" 2>&1 || {
            grep -Ein 'error:|failed|Executed' "$RUNNER_TEMP/sidesign-gsa-tests.log" | tail -n 50 || true
            exit 1
          }
          grep -F 'grandSlamWindowsProfileMatchesKnownWorkingAkdHeader' "$RUNNER_TEMP/sidesign-gsa-tests.log"
          swift test --filter 'simResync' > "$RUNNER_TEMP/sidesign-resync-tests.log" 2>&1 || {
            grep -Ein 'error:|failed|Executed|issue recorded' "$RUNNER_TEMP/sidesign-resync-tests.log" | tail -n 80 || true
            exit 1
          }
          grep -F 'simResyncWithoutMatchedProvisionedSessionFailsClosed' "$RUNNER_TEMP/sidesign-resync-tests.log"
          grep -F 'simResyncRefusesLegacyV1FallbackWhenAdiMissing' "$RUNNER_TEMP/sidesign-resync-tests.log"
          echo "SIDESIGN_GSA_TESTS_PASS"

      - name: Compile reviewed zh-Hans into iOS Storyboards
        shell: bash
        run: |
          set -euo pipefail
          python3 sidestore/scripts/apply_reviewed_zh_storyboards.py
          python3 sidestore/scripts/apply_reviewed_zh_storyboards.py --write
          grep -F 'title="我的应用"' sidestore/AltStore/iOS/Main.storyboard
          grep -F 'text="后台续签"' sidestore/AltStore/Settings/Settings.storyboard
          grep -F 'text="防止设备自动休眠"' sidestore/AltStore/Settings/Settings.storyboard
          echo "ZHHANS_COMPILED_STORYBOARDS_READY"

      - name: Test nested XCTest identity rewrite and safe rejection
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          swiftc \
            sidestore/SideStore/Core/Operations/PipelineOperations/NestedXCTestBundleID.swift \
            sidestore/scripts/NestedXCTestGuard/main.swift \
            -o "$RUNNER_TEMP/test-nested-xctest"
          "$RUNNER_TEMP/test-nested-xctest" | tee "$RUNNER_TEMP/test-nested-xctest.log"
          grep -Fx 'NESTED_XCTEST_IDENTITY_AND_ARTIFACT_REGRESSION_8_OF_8_PASS' "$RUNNER_TEMP/test-nested-xctest.log"
          grep -F 'NESTED_XCTEST_IDENTIFIERS_ALIGNED' sidestore/SideStore/Core/Operations/PipelineOperations/ResignAppOperation.swift

      - name: Test real background refresh completion ordering
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python3 sidestore/scripts/test_background_fetch_completion.py

      - name: Verify pinned guest AppGroup and Cookie HOME guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('live/LiveContainer/Tweaks/NSFileManager+GuestHooks.m').read_text()
          start = src.index('if(groupIdentifier.length == 0)')
          end = src.index('NSURL *result;', start)
          block = src[start:end]
          assert 'if(mappedPath.length > 0)' in block
          assert 'return [NSURL fileURLWithPath:mappedPath]' in block
          assert 'return nil;' in block
          assert 'return [self hook_containerURLForSecurityApplicationGroupIdentifier:' not in block
          assert 'if(groupIdentifier.length == 0)' in src
          assert 'if(!guestRoot || !guestRoot[0]) return nil;' in src
          assert 'const char *hostHomePath = getenv("HOME");' in src
          assert 'if (!lcHomePath || !lcHomePath[0] || !hostHomePath || !hostHomePath[0])' in src
          assert '[@(hostHomePath) stringByAppendingPathComponent:@"Library/Cookies"]' in src
          print("NESTED_GUEST_APPGROUP_NIL_FAIL_CLOSED_PASS")
          print("NESTED_GUEST_COOKIE_HOME_NULL_GUARD_PASS")
          PY

      - name: Assert validated remote pairing sidecar is read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('sidestore/SideStore/Core/Pairing/PairingFileManager.swift').read_text()
          start = src.index('private nonisolated func validatedRemotePairingCandidate()')
          end = src.index('nonisolated func hasPairingFile(for mode:', start)
          body = src[start:end]
          assert 'PairingFile_RemoteRP_Validated_v110.plist' in body
          assert 'PairingFileParser.parse(content: content, preferred: .rppairing)' in body
          assert 'parsed.mode == .rppairing' in body
          for forbidden in ('removeItem(', 'write(', 'moveItem(', 'replaceItem(', 'setAttributes('):
              assert forbidden not in body, f'Unexpected mutation in read-only sidecar: {forbidden}'
          assert 'VALIDATED_REMOTE_SIDECAR_SELECTED_NO_LEGACY_WRITE' in src
          assert 'if mode == .rppairing, let verified = validatedRemotePairingCandidate()' in src
          print('VALIDATED_RP_SIDECAR_READ_ONLY_GUARD_PASS')
          PY

      - name: Verify embedded SideStore return route uses the existing host handler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sidestore/AltStore/My Apps/MyAppsViewController.swift').read_text()
          assert 'returnToEmbeddedLiveContainer' in p
          assert 'ProcessInfo.processInfo.environment["LC_HOME_PATH"] != nil' in p
          assert 'livecontainer://livecontainer-launch?bundle-name=ui' in p
          assert 'returnItem.accessibilityLabel = "返回 LiveContainer"' in p
          # No account/pairing reset actions in the return handler
          body=p.split('@objc private func returnToEmbeddedLiveContainer()',1)[1].split('#endif',1)[0]
          assert 'UIApplication.shared.open(url, options: [:])' in body
          for forbidden in ('exit(', 'removeItem(', 'delete(', 'clear(', 'signOut(',
                            'resetPairing(', 'deletePairing(', 'removePairing('):
              assert forbidden not in body, forbidden
          print('EMBEDDED_SIDESTORE_RETURN_USES_EXISTING_GUEST_ROUTE_PASS')
          PY

      - name: Build patched SideStore for physical iPhone
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          cd sidestore
          xcodebuild archive -project AltStore.xcodeproj -scheme SideStore \
            -sdk iphoneos -configuration Release \
            -archivePath "$RUNNER_TEMP/ss_archive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=XYZ0123456 ORG_IDENTIFIER=com.SideStore \
            > "$RUNNER_TEMP/sidestore-build.log" 2>&1 || {
              echo "### BOUNDED SWIFT COMPILER DIAGNOSTICS"
              grep -Ein -C 3 'error:|fatal error:|swift compiler error|failed to compile|note: add .await.|performBackgroundFetch' \
                "$RUNNER_TEMP/sidestore-build.log" | tail -n 115 | cut -c 1-500 || true
              echo "### END OF BUILD LOG"
              tail -n 18 "$RUNNER_TEMP/sidestore-build.log" | cut -c 1-500
              exit 1
            }
          test -f "$RUNNER_TEMP/ss_archive.xcarchive/Products/Applications/SideStore.app/SideStore"
          mkdir -p "$RUNNER_TEMP/SideStorePayload/Payload"
          ditto "$RUNNER_TEMP/ss_archive.xcarchive/Products/Applications/SideStore.app" \
            "$RUNNER_TEMP/SideStorePayload/Payload/SideStore.app"
          cd "$RUNNER_TEMP/SideStorePayload"
          zip -qr "$RUNNER_TEMP/SideStore.ipa" Payload

      - name: Build pinned official LiveContainer 3.8.11 host
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          cd live
          xcodebuild archive -project LiveContainer.xcodeproj -scheme LiveContainer \
            -sdk iphoneos -configuration Release -arch arm64 \
            -archivePath "$RUNNER_TEMP/lc_archive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > "$RUNNER_TEMP/livecontainer-build.log" 2>&1 || {
              tail -n 75 "$RUNNER_TEMP/livecontainer-build.log"
              exit 1
            }
          test -f "$RUNNER_TEMP/lc_archive.xcarchive/Products/Applications/LiveContainer.app/LiveContainer"

      - name: Embed freshly compiled SideStore, never download old nightly
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          brew install ldid
          cd live
          ditto "$RUNNER_TEMP/lc_archive.xcarchive" archive.xcarchive
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 381111" archive.xcarchive/Products/Applications/LiveContainer.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 3.8.11" archive.xcarchive/Products/Applications/LiveContainer.app/Info.plist
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/build_github.sh')
          old = 'wget https://github.com/LiveContainer/SideStore/releases/download/nightly/SideStore.ipa'
          text = p.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit('ERROR: upstream LC embedding command changed')
          text = text.replace(old, 'cp "$RUNNER_TEMP/SideStore.ipa" SideStore.ipa')
          p.write_text(text, encoding='utf-8')
          PY
          export archive_path=archive scheme=LiveContainer
          sh .github/build_github.sh > "$RUNNER_TEMP/embedding.log" 2>&1 || {
            tail -n 85 "$RUNNER_TEMP/embedding.log"
            exit 1
          }
          test -s LiveContainer+SideStore.ipa
          python3 - <<'PY'
          import hashlib, json, plistlib, zipfile
          from pathlib import Path
          ipa = Path('LiveContainer+SideStore.ipa')
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None, 'IPA CRC failed'
              root = 'Payload/LiveContainer.app/'
              main = plistlib.loads(z.read(root + 'Info.plist'))
              assert main['CFBundleVersion'] == '381111', 'Build marker not embedded'
              assert main['CFBundleShortVersionString'] == '3.8.11', 'Wrong visible host version'
              embed = root + 'Frameworks/SideStoreApp.framework/'
              side = plistlib.loads(z.read(embed + 'Info.plist'))
              assert main['CFBundleIdentifier'] == 'com.kdt.livecontainer'
              assert side['CFBundleIdentifier'] == 'com.SideStore.SideStore'
              assert z.read(embed + 'SideStore')
              extensions = [x for x in z.namelist() if '/PlugIns/' in x and x.endswith('.appex/Info.plist')]
              assert len(extensions) >= 4, 'Missing required app extensions'
          import subprocess
          side_commit = subprocess.check_output(['git', '-C', '../sidestore', 'rev-parse', 'HEAD'], text=True).strip()
          print(json.dumps({'status': 'UNSIGNED_CANDIDATE_NOT_DEVICE_TESTED',
                            'side_source_commit': side_commit,
                            'host_source_commit': '1a43f38b1608ea21c761d779181cffa28d3e96d6',
                            'sha256': hashlib.sha256(ipa.read_bytes()).hexdigest()}))
          PY
          shasum -a 256 LiveContainer+SideStore.ipa > candidate.sha256

      - name: Preserve unsigned candidate for controlled iLoader signing
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lc381111-return-to-container-unsigned
          path: |
            live/LiveContainer+SideStore.ipa
            live/candidate.sha256
          if-no-files-found: error
          retention-days: 14
